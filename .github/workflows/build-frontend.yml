name: build-frontend

on:
  push:
    branches:
      - main
      - develop

    # Prevent unnecessary builds for non-code changes (documentation and editor settings).
    # This saves GitHub Actions minutes and optimizes the development workflow.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install

      - name: Clean old Build
        run: rm -rf public/build

      - name: Build Frontend
        run: npm run build

      # NOTE: Only for Laravel + React hosted on shared hosting (cPanel)
      - name: Force Add Build Folder
        run: |
          git add public/build --force
          git status

      - name: Commit build
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: build frontend [skip ci]'
          commit_options: '--no-verify'
