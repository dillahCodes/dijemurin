services:
  # ==========================================
  # DEVELOPMENT DEPLOYMENT
  # ==========================================

  dev:
    build:
      context: .
      target: dev
    container_name: dijemurin-dev
    env_file:
      - .env
    ports:
      - '8000:8080'
      - '5173:5173'
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

  # ==========================================
  # PRODUCTION DEPLOYMENT
  # ==========================================

  prod:
    image: dillahcodes/dijemurin:latest
    container_name: dijemurin-prod
    env_file:
      - .env
    environment:
      - APP_ENV=production
    ports:
      - '8000:8080'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - prod

  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  db:
    image: postgres:18.4-alpine
    container_name: db
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
